  .k { font-size: 14px; font-weight: 600; letter-spacing: .08em; fill: #6e6e73; }
  .h { font-size: 27px; font-weight: 700; letter-spacing: -.02em; }
  .s { font-size: 15px; fill: #6e6e73; }
  .b { font-weight: 700; }
  .ur { font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', 'Segoe UI', Tahoma, serif; }
</style>
