<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="rob-title rob-desc">
  <title id="rob-title">Multilingual Domain Robustness Protocol &amp; Architecture</title>
  <desc id="rob-desc">Comprehensive empirical evaluation across Native Urdu and Roman Urdu datasets demonstrating stability tiers under domain shift.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Nastaliq+Urdu:wght@400;600;700&amp;display=swap');
      text {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
    </style>
    <linearGradient id="bg-rob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f7"/>
    </linearGradient>
    <linearGradient id="core-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#5856d6"/>
    </linearGradient>
    <linearGradient id="bar-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34c759"/>
      <stop offset="100%" stop-color="#30d158"/>
    </linearGradient>
    <linearGradient id="bar-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#409cff"/>
    </linearGradient>
    <linearGradient id="bar-warn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9500"/>
      <stop offset="100%" stop-color="#ff3b30"/>
    </linearGradient>
    <filter id="soft-card-shadow" x="-5%" y="-5%" width="112%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="880" height="340" rx="22" fill="url(#bg-rob)" stroke="#d2d2d7" stroke-width="1"/>

  <!-- Left Column: Input Modalities & Scripts (Width: 240) -->
  <g transform="translate(28, 26)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#86868b" text-transform="uppercase">Corpus &amp; Script Streams</text>

    <!-- Native Urdu Card -->
    <g transform="translate(0, 14)" filter="url(#soft-card-shadow)">
      <rect width="240" height="74" rx="14" fill="#ffffff" stroke="#e5e5ea" stroke-width="1"/>
      <rect x="14" y="15" width="44" height="44" rx="10" fill="#f0f6ff"/>
      <text x="36" y="44" font-family="'Noto Nastaliq Urdu', -apple-system, serif" font-size="18" font-weight="700" fill="#0071e3" text-anchor="middle">اردو</text>
      <text x="68" y="34" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700" fill="#1d1d1f">Native Urdu</text>
      <text x="68" y="52" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" fill="#86868b">Perso-Arabic script · 18 corpora</text>
    </g>

    <!-- Roman Urdu Card -->
    <g transform="translate(0, 100)" filter="url(#soft-card-shadow)">
      <rect width="240" height="74" rx="14" fill="#ffffff" stroke="#e5e5ea" stroke-width="1"/>
      <rect x="14" y="15" width="44" height="44" rx="10" fill="#f6f3ff"/>
      <text x="36" y="42" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14" font-weight="800" fill="#5856d6" text-anchor="middle">RU</text>
      <text x="68" y="34" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700" fill="#1d1d1f">Roman Urdu</text>
      <text x="68" y="52" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" fill="#86868b">Phonetic Latin script · 15 corpora</text>
    </g>

    <!-- De-Leakage Verification Badge -->
    <g transform="translate(0, 186)" filter="url(#soft-card-shadow)">
      <rect width="240" height="78" rx="14" fill="#ffffff" stroke="#e5e5ea" stroke-width="1"/>
      <rect x="14" y="17" width="44" height="44" rx="10" fill="#f0faf2"/>
      <path d="M30 39l4.5 4.5 9-9" fill="none" stroke="#34c759" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="36" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700" fill="#1d1d1f">4,196 Leaks Removed</text>
      <text x="68" y="54" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" fill="#34c759" font-weight="600">Exact train-test duplicates purged</text>
    </g>
  </g>

  <!-- Connecting bezier flows -->
  <path d="M268 77 C295 77, 305 130, 326 142" fill="none" stroke="#0071e3" stroke-width="2.5" stroke-dasharray="4 4"/>
  <path d="M268 151 H326" fill="none" stroke="#5856d6" stroke-width="2.5"/>
  <path d="M268 225 C295 225, 305 170, 326 158" fill="none" stroke="#34c759" stroke-width="2.5" stroke-dasharray="4 4"/>

  <!-- Center Column: Robustness Protocol Core (Width: 232) -->
  <g transform="translate(326, 26)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#86868b" text-transform="uppercase">Robustness Protocol</text>

    <g transform="translate(0, 14)" filter="url(#soft-card-shadow)">
      <rect width="232" height="250" rx="16" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/>
      
      <!-- Core Brand Pill -->
      <rect x="14" y="14" width="204" height="42" rx="10" fill="url(#core-glow)"/>
      <text x="116" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">ROBUSTNESS ENGINE</text>
      <text x="116" y="46" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9.5" font-weight="500" fill="rgba(255,255,255,0.9)" text-anchor="middle">Baseline-Guarded Ratio Protocol</text>

      <!-- Inner Stats Breakdown -->
      <g transform="translate(18, 70)">
        <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" fill="#86868b">Benchmark Scope</text>
        <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="800" fill="#1d1d1f">33 <tspan font-size="13" font-weight="500" fill="#86868b">Datasets</tspan> · 288k <tspan font-size="13" font-weight="500" fill="#86868b">Items</tspan></text>
        
        <line x1="0" y1="46" x2="196" y2="46" stroke="#f0f0f2" stroke-width="1"/>

        <text x="0" y="64" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" fill="#86868b">Evaluated Encoders</text>
        <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="600" fill="#0071e3">XLM-R · Qwen 2.5 · Llama 3</text>
        <text x="0" y="96" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" fill="#6e6e73">Mistral · mBERT (Zero-Shot &amp; FT)</text>

        <line x1="0" y1="110" x2="196" y2="110" stroke="#f0f0f2" stroke-width="1"/>

        <text x="0" y="128" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" fill="#86868b">Guarded Metric Formulation</text>
        <text x="0" y="146" font-family="ui-serif, Georgia, serif" font-size="12.5" font-style="italic" fill="#1d1d1f">R_guard = (S_tgt - Floor) / (S_src - Floor)</text>
        <text x="0" y="164" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9.5" font-weight="600" fill="#34c759">Accounts for task difficulty floors</text>
      </g>
    </g>
  </g>

  <!-- Connecting lines to output -->
  <path d="M558 104 H588" fill="none" stroke="#34c759" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M558 151 H588" fill="none" stroke="#0071e3" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M558 198 H588" fill="none" stroke="#ff3b30" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right Column: Empirical Stability Tiers (Width: 264) -->
  <g transform="translate(588, 26)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#86868b" text-transform="uppercase">Empirical Stability Tiers</text>

    <!-- Same Source Tier (Upper Bound) -->
    <g transform="translate(0, 14)" filter="url(#soft-card-shadow)">
      <rect width="264" height="74" rx="14" fill="#ffffff" stroke="#e5e5ea" stroke-width="1"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="700" fill="#1d1d1f">Same-Source Stability</text>
      <text x="248" y="25" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="15" font-weight="800" fill="#34c759" text-anchor="end">84.5%</text>
      <!-- Progress Bar -->
      <rect x="16" y="35" width="232" height="7" rx="3.5" fill="#f0f0f2"/>
      <rect x="16" y="35" width="196" height="7" rx="3.5" fill="url(#bar-green)"/>
      <text x="16" y="57" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" fill="#86868b">Standard intra-domain split (Benchmark ceiling)</text>
    </g>

    <!-- Target Domain Tier (Domain Adapted) -->
    <g transform="translate(0, 100)" filter="url(#soft-card-shadow)">
      <rect width="264" height="74" rx="14" fill="#ffffff" stroke="#e5e5ea" stroke-width="1"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="700" fill="#1d1d1f">Target-Domain Adaptation</text>
      <text x="248" y="25" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="15" font-weight="800" fill="#0071e3" text-anchor="end">72.4%</text>
      <!-- Progress Bar -->
      <rect x="16" y="35" width="232" height="7" rx="3.5" fill="#f0f0f2"/>
      <rect x="16" y="35" width="168" height="7" rx="3.5" fill="url(#bar-blue)"/>
      <text x="16" y="57" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" fill="#86868b">Supervised fine-tuning with target distribution</text>
    </g>

    <!-- Cross Domain Floor Tier (OOD Shift) -->
    <g transform="translate(0, 186)" filter="url(#soft-card-shadow)">
      <rect width="264" height="78" rx="14" fill="#ffffff" stroke="#e5e5ea" stroke-width="1"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="700" fill="#1d1d1f">Zero-Shot Cross-Domain Floor</text>
      <text x="248" y="25" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="15" font-weight="800" fill="#ff3b30" text-anchor="end">48.1%</text>
      <!-- Progress Bar -->
      <rect x="16" y="35" width="232" height="7" rx="3.5" fill="#f0f0f2"/>
      <rect x="16" y="35" width="112" height="7" rx="3.5" fill="url(#bar-warn)"/>
      <text x="16" y="57" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="600" fill="#ff3b30">Unseen domains experience substantial decay</text>
      <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9.5" fill="#86868b">Exposes vulnerability to syntax &amp; dialect shifts</text>
    </g>
  </g>
</svg>
