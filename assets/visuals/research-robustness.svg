<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" role="img" aria-labelledby="t d" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif">
<title id="t">Domain robustness across Urdu scripts</title>
<desc id="d">The same Urdu sentence in Nastaliq and Roman script above a glowing train-to-test domain matrix. Fine-tuned encoders lose up to 47.6 macro-F1 off-domain; few-shot LLMs win 30 of 42 comparisons. 26 datasets, 188,309 examples.</desc>
<defs><radialGradient id="g0"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.5"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient><radialGradient id="g1"><stop offset="0" stop-color="#06b6d4" stop-opacity="0.3"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.05"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/></filter>
</defs>
<rect x="0.0" y="0.0" width="600.0" height="375.0" rx="0" fill="#020b1f" /><circle cx="120" cy="90" r="300" fill="url(#g0)"/><circle cx="560" cy="340" r="240" fill="url(#g1)"/><rect width="600" height="375" fill="url(#dots)"/>
