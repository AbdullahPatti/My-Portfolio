<text x="60" y="336" font-size="15" font-weight="400" text-anchor="start" style="fill:#6e6e73">+ universal patch</text>
<text x="290" y="140" font-size="15" font-weight="700" text-anchor="start" style="fill:#1d1d1f">FP32 patch → INT8 model</text>
