<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" role="img" aria-labelledby="t d" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif">
<title id="t">Does compression preserve adversarial patch robustness?</title>
<desc id="d">An airplane image with a small adversarial patch is classified as a frog. Pruned models hold baseline robustness, quantized models keep the full model&#x27;s attack surface, and smaller dense models drop from 61.2 to 52.9 percent patched accuracy.</desc>
