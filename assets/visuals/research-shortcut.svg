<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" role="img" aria-labelledby="t d">
<title id="t">When benchmarks mislead: reversed transfer and shortcut learning</title>
<desc id="d">Fake Urdu articles run 3.4 times longer than real ones. Zero-shot transfer reaches 0.771 macro-F1 one way and collapses to 0.005 reversed; the same shortcut appears in Urdu fake news, English fake news and sarcasm detection.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2f2f5"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0071e3"/><stop offset="1" stop-color="#5856d6"/></linearGradient>
  <linearGradient id="accentV" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0071e3"/><stop offset="1" stop-color="#5856d6"/></linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9500"/><stop offset="1" stop-color="#ff2d55"/></linearGradient>
  <linearGradient id="fresh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34c759"/><stop offset="1" stop-color="#30b0c7"/></linearGradient>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.07"/></filter>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#a1a1a6"/></marker>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #1d1d1f; }
  .k { font-size: 14px; font-weight: 600; letter-spacing: .08em; fill: #6e6e73; }
  .h { font-size: 27px; font-weight: 700; letter-spacing: -.02em; }
  .s { font-size: 15px; fill: #6e6e73; }
  .b { font-weight: 700; }
  .ur { font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', 'Segoe UI', Tahoma, serif; }
</style>
<rect width="600" height="500" fill="url(#bg)"/>
<text x="36" y="50" class="k">CROSS-DATASET TRANSFER</text>
<text x="36" y="86" class="h">It learned length, not deception</text>

<rect x="36" y="108" width="528" height="360" rx="18" fill="#ffffff" stroke="#e5e5ea" filter="url(#sh)"/>
<rect x="60" y="132" width="100" height="210" rx="12" fill="#fff" stroke="#e5e5ea"/><rect x="74" y="146" width="58" height="22" rx="11" fill="#ffe5e3"/><text x="103" y="162" font-size="12" font-weight="700" text-anchor="middle" style="fill:#d70015">FAKE</text><rect x="74" y="178" width="72" height="6" rx="3" fill="#e5e5ea"/><rect x="74" y="191" width="72" height="6" rx="3" fill="#e5e5ea"/><rect x="74" y="204" width="56" height="6" rx="3" fill="#e5e5ea"/><rect x="74" y="217" width="72" height="6" rx="3" fill="#e5e5ea"/><rect x="74" y="230" width="72" height="6" rx="3" fill="#e5e5ea"/><rect x="74" y="243" width="72" height="6" rx="3" fill="#e5e5ea"/><rect x="74" y="256" width="56" height="6" rx="3" fill="#e5e5ea"/><rect x="74" y="269" width="72" height="6" rx="3" fill="#e5e5ea"/><rect x="74" y="282" width="72" height="6" rx="3" fill="#e5e5ea"/><rect x="74" y="295" width="72" height="6" rx="3" fill="#e5e5ea"/><rect x="74" y="308" width="56" height="6" rx="3" fill="#e5e5ea"/><rect x="74" y="321" width="72" height="6" rx="3" fill="#e5e5ea"/>
<rect x="176" y="278" width="100" height="64" rx="12" fill="#fff" stroke="#e5e5ea"/><rect x="190" y="292" width="58" height="22" rx="11" fill="#e3f7e8"/><text x="219" y="308" font-size="12" font-weight="700" text-anchor="middle" style="fill:#248a3d">REAL</text><rect x="190" y="324" width="72" height="6" rx="3" fill="#e5e5ea"/>
<text x="176" y="208" font-size="40" font-weight="700" text-anchor="start" style="fill:#c93400">3.4×</text>
<text x="178" y="234" font-size="15" font-weight="400" text-anchor="start" style="fill:#6e6e73">longer</text>
