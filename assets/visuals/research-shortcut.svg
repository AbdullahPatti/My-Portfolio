<rect x="334" y="187.79999999999998" width="90" height="154.20000000000002" rx="10" fill="url(#accentV)"/>
<text x="379" y="175.79999999999998" font-size="28" font-weight="700" text-anchor="middle" style="fill:#0071e3">0.771</text>
<rect x="444" y="337" width="90" height="5" rx="2.5" fill="#ff3b30"/>
<text x="489" y="324" font-size="28" font-weight="700" text-anchor="middle" style="fill:#d70015">0.005</text>
<text x="379" y="366" font-size="14" font-weight="400" text-anchor="middle" style="fill:#6e6e73">train A → B</text>
<text x="489" y="366" font-size="14" font-weight="400" text-anchor="middle" style="fill:#6e6e73">reversed</text>
<line x1="60" x2="540" y1="402" y2="402" stroke="#ececf0"/><text x="60.0" y="436" font-size="24" font-weight="700" text-anchor="start" style="fill:#1d1d1f">Urdu</text><text x="60.0" y="458" font-size="14" font-weight="400" text-anchor="start" style="fill:#6e6e73">fake news</text><text x="220.0" y="436" font-size="24" font-weight="700" text-anchor="start" style="fill:#1d1d1f">English</text><text x="220.0" y="458" font-size="14" font-weight="400" text-anchor="start" style="fill:#6e6e73">fake news</text><text x="380.0" y="436" font-size="24" font-weight="700" text-anchor="start" style="fill:#1d1d1f">Sarcasm</text><text x="380.0" y="458" font-size="14" font-weight="400" text-anchor="start" style="fill:#6e6e73">detection</text>
