<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="sc-title sc-desc">
  <title id="sc-title">Benchmark Shortcut Learning &amp; Reversed Transfer Collapse</title>
  <desc id="sc-desc">Visualization of reversed transfer failure from 0.771 down to 0.005 macro-F1 caused by a 3.4x token length confound shortcut in NLP benchmarks.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
    </style>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f7"/>
    </linearGradient>
    <linearGradient id="sc-header-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5856d6"/>
      <stop offset="100%" stop-color="#ff3b30"/>
    </linearGradient>
    <linearGradient id="sc-bar-red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#ff6961"/>
    </linearGradient>
    <linearGradient id="sc-bar-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#409cff"/>
    </linearGradient>
    <linearGradient id="sc-bar-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34c759"/>
      <stop offset="100%" stop-color="#30d158"/>
    </linearGradient>
    <filter id="sc-card-shadow" x="-5%" y="-5%" width="112%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="880" height="340" rx="22" fill="url(#sc-bg)" stroke="#d2d2d7" stroke-width="1"/>

  <!-- Left Column: Confound Analysis (Width: 240, x: 28) -->
  <g transform="translate(28, 26)">
    <text x="0" y="0" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#86868b" text-transform="uppercase">Confound Analysis</text>

    <!-- Card 1: Token Length Ratio -->
    <g transform="translate(0, 14)" filter="url(#sc-card-shadow)">
      <rect width="240" height="118" rx="14" fill="#ffffff" stroke="#e5e5ea" stroke-width="1"/>
      <text x="16" y="24" font-size="12" font-weight="700" fill="#1d1d1f">Token Length Ratio Disparity</text>
      
      <!-- Fake News length bar -->
      <g transform="translate(16, 38)">
        <text x="0" y="0" font-size="10.5" font-weight="600" fill="#ff3b30">Fake News: 342 tokens (avg)</text>
        <rect x="0" y="6" width="208" height="8" rx="4" fill="#f0f0f2"/>
        <rect x="0" y="6" width="202" height="8" rx="4" fill="url(#sc-bar-red)"/>
      </g>

      <!-- Real News length bar -->
      <g transform="translate(16, 68)">
        <text x="0" y="0" font-size="10.5" font-weight="600" fill="#0071e3">Real News: 101 tokens (avg)</text>
        <rect x="0" y="6" width="208" height="8" rx="4" fill="#f0f0f2"/>
        <rect x="0" y="6" width="60" height="8" rx="4" fill="url(#sc-bar-blue)"/>
      </g>

      <!-- Disparity Callout Pill -->
      <g transform="translate(16, 94)">
        <rect width="208" height="16" rx="8" fill="#ffebee"/>
        <text x="104" y="11.5" font-size="9.5" font-weight="700" fill="#ff3b30" text-anchor="middle">3.4× Disparity: Exploited as Shortcut Cue</text>
      </g>
    </g>

    <!-- Card 2: Tested Domains -->
    <g transform="translate(0, 144)" filter="url(#sc-card-shadow)">
      <rect width="240" height="120" rx="14" fill="#ffffff" stroke="#e5e5ea" stroke-width="1"/>
      <text x="16" y="24" font-size="12" font-weight="700" fill="#1d1d1f">Tested Benchmark Domains</text>
      
      <g transform="translate(16, 38)">
        <circle cx="6" cy="5" r="3.5" fill="#0071e3"/>
        <text x="16" y="9" font-size="11" font-weight="500" fill="#1d1d1f">Urdu Fake News <tspan fill="#86868b">(PK News Corpus)</tspan></text>
      </g>
      
      <g transform="translate(16, 60)">
        <circle cx="6" cy="5" r="3.5" fill="#5856d6"/>
        <text x="16" y="9" font-size="11" font-weight="500" fill="#1d1d1f">English Fake News <tspan fill="#86868b">(ISOT Dataset)</tspan></text>
      </g>
      
      <g transform="translate(16, 82)">
        <circle cx="6" cy="5" r="3.5" fill="#ff9500"/>
        <text x="16" y="9" font-size="11" font-weight="500" fill="#1d1d1f">Sarcasm &amp; Irony <tspan fill="#86868b">(SemEval 2018)</tspan></text>
      </g>
      
      <text x="16" y="110" font-size="9.5" font-weight="600" fill="#0071e3">Cross-corpus zero-shot evaluation</text>
    </g>
  </g>

  <!-- Flow Lines (Col 1 to Col 2) -->
  <path d="M268 99 C296 99, 298 73, 326 73" fill="none" stroke="#34c759" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M268 204 C296 204, 298 203, 326 203" fill="none" stroke="#ff3b30" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Center Column: Transfer Direction Test (Width: 232, x: 326) -->
  <g transform="translate(326, 26)">
    <text x="0" y="0" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#86868b" text-transform="uppercase">Transfer Direction Test</text>

    <!-- Card 1: Forward Direction -->
    <g transform="translate(0, 14)" filter="url(#sc-card-shadow)">
      <rect width="232" height="118" rx="14" fill="#ffffff" stroke="#e5e5ea" stroke-width="1"/>
      <circle cx="26" cy="25" r="11" fill="#e8f5e9"/>
      <path d="M21 25l3.5 3.5 7-7" fill="none" stroke="#34c759" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="45" y="23" font-size="12" font-weight="700" fill="#1d1d1f">Train → Test (Forward)</text>
      <text x="45" y="36" font-size="10" fill="#6e6e73">Exploits length cue</text>
      
      <text x="18" y="74" font-size="28" font-weight="800" fill="#34c759" letter-spacing="-0.03em">0.771</text>
      <text x="96" y="68" font-size="11" font-weight="600" fill="#86868b">macro-F1</text>
      
      <rect x="156" y="52" width="62" height="22" rx="11" fill="#e8f5e9"/>
      <text x="187" y="67" font-size="11" font-weight="700" fill="#34c759" text-anchor="middle">Passes</text>

      <line x1="16" y1="88" x2="216" y2="88" stroke="#f0f0f2" stroke-width="1"/>
      <text x="16" y="104" font-size="10" fill="#86868b">Spurious feature aligns with test set</text>
    </g>

    <!-- Card 2: Reversed Direction -->
    <g transform="translate(0, 144)" filter="url(#sc-card-shadow)">
      <rect width="232" height="120" rx="14" fill="#ffffff" stroke="#e5e5ea" stroke-width="1"/>
      <circle cx="26" cy="25" r="11" fill="#ffebee"/>
      <path d="M21 20l10 10m0-10l-10 10" fill="none" stroke="#ff3b30" stroke-width="2.2" stroke-linecap="round"/>
      <text x="45" y="23" font-size="12" font-weight="700" fill="#1d1d1f">Test → Train (Reversed)</text>
      <text x="45" y="36" font-size="10" fill="#ff3b30">Length cue misleads</text>
      
      <text x="18" y="76" font-size="28" font-weight="800" fill="#ff3b30" letter-spacing="-0.03em">0.005</text>
      <text x="96" y="70" font-size="11" font-weight="600" fill="#86868b">macro-F1</text>
      
      <rect x="146" y="54" width="72" height="22" rx="11" fill="#ffebee"/>
      <text x="182" y="69" font-size="11" font-weight="700" fill="#ff3b30" text-anchor="middle">Collapses</text>

      <line x1="16" y1="90" x2="216" y2="90" stroke="#f0f0f2" stroke-width="1"/>
      <text x="16" y="106" font-size="10" font-weight="600" fill="#ff3b30">Catastrophic generalization breakdown</text>
    </g>
  </g>

  <!-- Flow Lines (Col 2 to Col 3) -->
  <path d="M558 73 H588" fill="none" stroke="#34c759" stroke-width="2" stroke-linecap="round"/>
  <path d="M558 204 H588" fill="none" stroke="#ff3b30" stroke-width="2" stroke-linecap="round"/>

  <!-- Right Column: Empirical Finding (Width: 264, x: 588) -->
  <g transform="translate(588, 26)">
    <text x="0" y="0" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#86868b" text-transform="uppercase">Empirical Diagnostic Matrix</text>

    <g transform="translate(0, 14)" filter="url(#sc-card-shadow)">
      <rect width="264" height="250" rx="16" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/>
      
      <!-- Core Brand Pill Header -->
      <rect x="14" y="14" width="236" height="42" rx="10" fill="url(#sc-header-grad)"/>
      <text x="132" y="32" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">SHORTCUT DIAGNOSTIC</text>
      <text x="132" y="46" font-size="9.5" font-weight="500" fill="rgba(255,255,255,0.92)" text-anchor="middle">Reverse-Split Evaluation Protocol</text>

      <!-- Inner Content -->
      <g transform="translate(18, 68)">
        <!-- Forward Macro-F1 Bar -->
        <text x="0" y="12" font-size="11" font-weight="600" fill="#1d1d1f">Forward Transfer (Spurious)</text>
        <text x="228" y="12" font-size="13" font-weight="800" fill="#34c759" text-anchor="end">0.771</text>
        <rect x="0" y="18" width="228" height="6.5" rx="3.25" fill="#f0f0f2"/>
        <rect x="0" y="18" width="176" height="6.5" rx="3.25" fill="url(#sc-bar-green)"/>

        <!-- Reversed Macro-F1 Bar -->
        <text x="0" y="44" font-size="11" font-weight="600" fill="#1d1d1f">Reversed Transfer (Semantics)</text>
        <text x="228" y="44" font-size="13" font-weight="800" fill="#ff3b30" text-anchor="end">0.005</text>
        <rect x="0" y="50" width="228" height="6.5" rx="3.25" fill="#f0f0f2"/>
        <rect x="0" y="50" width="8" height="6.5" rx="3.25" fill="url(#sc-bar-red)"/>

        <line x1="0" y1="68" x2="228" y2="68" stroke="#f0f0f2" stroke-width="1"/>

        <!-- Key Takeaway Text -->
        <text x="0" y="86" font-size="11" font-weight="700" fill="#1d1d1f">Causal Takeaway:</text>
        <text x="0" y="103" font-size="10.5" fill="#6e6e73">Models latch onto sentence length cues</text>
        <text x="0" y="119" font-size="10.5" fill="#6e6e73">rather than learning true semantic</text>
        <text x="0" y="135" font-size="10.5" fill="#6e6e73">indicators of deception.</text>

        <!-- Bottom Protocol Badge -->
        <rect x="0" y="148" width="228" height="24" rx="8" fill="#ffebee"/>
        <text x="114" y="164" font-size="10" font-weight="700" fill="#ff3b30" text-anchor="middle">Reverse-Split Protocol is Critical</text>
      </g>
    </g>
  </g>
</svg>
