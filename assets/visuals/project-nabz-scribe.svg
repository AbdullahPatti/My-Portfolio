<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" role="img" aria-labelledby="t d" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif">
<title id="t">Nabz Scribe</title>
<desc id="d">A phone in airplane mode records a doctor-patient consultation in Urdu, Punjabi and English; a pulse line turns it into a printed prescription. 37.6 seconds of audio is processed in 11.6 seconds on a phone CPU, and medicine recall rose from 10 to 50 percent.</desc>
