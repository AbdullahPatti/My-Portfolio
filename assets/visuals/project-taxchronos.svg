<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" role="img" aria-labelledby="t d" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif">
<title id="t">TaxChronos</title>
<desc id="d">A fan of tax-law versions from 2019 to 2025 with the 2022 version pulled out and a cited section highlighted, beside an Urdu question answered from the 2022 law in under 20 seconds.</desc>
<defs><radialGradient id="g0"><stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient><radialGradient id="g1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.05"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/></filter>
</defs>
<rect x="0.0" y="0.0" width="600.0" height="375.0" rx="0" fill="#06071c" /><circle cx="160" cy="60" r="320" fill="url(#g0)"/><circle cx="580" cy="340" r="220" fill="url(#g1)"/><rect width="600" height="375" fill="url(#dots)"/>
