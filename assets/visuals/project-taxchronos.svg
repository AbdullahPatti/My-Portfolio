 stood in TY 2022</text><rect x="152.0" y="176.0" width="122.0" height="5.0" rx="2.5" fill="#e5e7eb" /><rect x="152.0" y="192.0" width="92.0" height="5.0" rx="2.5" fill="#e5e7eb" /><rect x="152.0" y="208.0" width="122.0" height="5.0" rx="2.5" fill="#e5e7eb" /><rect x="152.0" y="224.0" width="92.0" height="5.0" rx="2.5" fill="#e5e7eb" /><rect x="152.0" y="240.0" width="122.0" height="5.0" rx="2.5" fill="#e5e7eb" /><rect x="148.0" y="238.0" width="130.0" height="24.0" rx="8" fill="#eef2ff" /><text x="158.0" y="254.0" font-size="10.5" font-weight="700" fill="#4f46e5" text-anchor="start" >§149 cited</text><text x="36.0" y="340.0" font-size="11" font-weight="500" fill="#fff" fill-opacity="0.55" text-anchor="start" >840 past versions of 12 FBR statutes</text><rect x="400.0" y="40.0" width="166.0" height="44.0" rx="22" fill="#6366f1" /><text x="552.0" y="69.0" font-size="14" font-weight="700" fill="#fff" text-anchor="end" font-family="'Noto Nastaliq Urdu','Segoe UI',Tahoma,serif" >2022 میں ٹیکس کی شرح؟</text><rect x="400.0" y="96.0" width="166.0" height="112.0" rx="18" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.16"/><text x="416.0" y="120.0" font-size="12" font-weight="700" fill="#fff" text-anchor="start" >Answered from</text><text x="416.0" y="136.0" font-size="12" font-weight="700" fill="#fff" text-anchor="start" >the 2022 law</text><text x="416.0" y="156.0" font-size="10.5" font-weight="500" fill="#fff" fill-opacity="0.6" text-anchor="start" >Urdu, Roman Urdu or</text><text x="416.0" y="170.0" font-size="10.5" font-weight="500" fill="#fff" fill-opacity="0.6" text-anchor="start" >English, with sources</text><rect x="416.0" y="180.0" width="106.2" height="18.9" rx="9.450000000000001" fill="#818cf8" fill-opacity="0.2"/><text x="469.1" y="192.7" font-size="9" font-weight="700" fill="#c7d2fe" text-anchor="middle" >LangGraph · RAGAS</text><text x="400.0" y="288.0" font-size="40" font-weight="800" fill="#fff" text-anchor="start" >&lt; 20 s</text><text x="400.0" y="312.0" font-size="11" font-weight="500" fill="#fff" fill-opacity="0.6" text-anchor="start" >per answer, vs 2–3 min</text><text x="400.0" y="327.0" font-size="11" font-weight="500" fill="#fff" fill-opacity="0.6" text-anchor="start" >of manual search</text>
