<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" role="img" aria-labelledby="t d" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif">
<title id="t">Daily Digest</title>
<desc id="d">A sunrise with a dial of delivery hours from 6 to 10 AM, 7 AM selected, above a morning email brief of three Gemini-summarized Pakistan stories ranked by relevance. 15+ daily readers, zero infrastructure cost.</desc>
