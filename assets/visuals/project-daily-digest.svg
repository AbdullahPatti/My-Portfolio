fff" fill-opacity="0.6" text-anchor="end" >infra per month</text><g filter="url(#sh)"><rect x="150.0" y="196.0" width="300.0" height="160.0" rx="18" fill="#fff" /></g><text x="168.0" y="222.0" font-size="13" font-weight="800" fill="#1d1d1f" text-anchor="start" >Your 7 AM brief</text><text x="432.0" y="222.0" font-size="9.5" font-weight="600" fill="#f97316" text-anchor="end" >Gemini summary</text><rect x="164.0" y="242.0" width="272.0" height="30.0" rx="9" fill="#f5f5f7" /><rect x="172.0" y="249.0" width="30.0" height="16.0" rx="8.0" fill="#16a34a" fill-opacity="0.14"/><text x="187.0" y="259.7" font-size="7.5" font-weight="700" fill="#16a34a" text-anchor="middle" >ECON</text><text x="208.0" y="261.0" font-size="10.5" font-weight="600" fill="#1d1d1f" text-anchor="start" >Rupee steadies as reserves rise</text><text x="428.0" y="261.0" font-size="9.5" font-weight="800" fill="#f97316" text-anchor="end" >0.96</text><rect x="164.0" y="278.0" width="272.0" height="30.0" rx="9" fill="#f5f5f7" /><rect x="172.0" y="285.0" width="30.0" height="16.0" rx="8.0" fill="#2563eb" fill-opacity="0.14"/><text x="187.0" y="295.7" font-size="7.5" font-weight="700" fill="#2563eb" text-anchor="middle" >TECH</text><text x="208.0" y="297.0" font-size="10.5" font-weight="600" fill="#1d1d1f" text-anchor="start" >Lahore startup raises AI seed</text><text x="428.0" y="297.0" font-size="9.5" font-weight="800" fill="#f97316" text-anchor="end" >0.91</text><rect x="164.0" y="314.0" width="272.0" height="30.0" rx="9" fill="#f5f5f7" /><rect x="172.0" y="321.0" width="39.0" height="16.0" rx="8.0" fill="#7c3aed" fill-opacity="0.14"/><text x="191.5" y="331.7" font-size="7.5" font-weight="700" fill="#7c3aed" text-anchor="middle" >POLICY</text><text x="217.0" y="333.0" font-size="10.5" font-weight="600" fill="#1d1d1f" text-anchor="start" >New e-filing rules for salaried</text><text x="428.0" y="333.0" font-size="9.5" font-weight="800" fill="#f97316" text-anchor="end" >0.84</text>
