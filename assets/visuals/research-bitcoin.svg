<title id="t">RAML: regime-aware multimodal fusion for Bitcoin direction</title>
<desc id="d">Hourly Bitcoin candlesticks with a high-volatility regime. FinBERT Reddit sentiment and BiLSTM price features pass through a gate conditioned on 24-hour volatility to predict direction, reaching 0.547 and 0.551 macro-F1 at 3 and 6 hours over 3,491 hours.</desc>
