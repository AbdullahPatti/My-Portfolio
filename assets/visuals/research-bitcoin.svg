<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="btc-title btc-desc">
  <title id="btc-title">RAML Regime-Aware Multimodal Signal Fusion Architecture</title>
  <desc id="btc-desc">Dynamic learnable sigmoid gating mechanism conditioning social sentiment and technical signals on rolling market volatility regimes.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
    </style>
    <linearGradient id="btc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f7"/>
    </linearGradient>
    <linearGradient id="gate-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9500"/>
      <stop offset="100%" stop-color="#ff2d55"/>
    </linearGradient>
    <linearGradient id="btc-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34c759"/>
      <stop offset="100%" stop-color="#30d158"/>
    </linearGradient>
    <linearGradient id="btc-red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#ff6961"/>
    </linearGradient>
    <linearGradient id="spark-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9500" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff9500" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="tech-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0071e3" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0071e3" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="btc-card-shadow" x="-5%" y="-5%" width="112%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="880" height="340" rx="22" fill="url(#btc-bg)" stroke="#d2d2d7" stroke-width="1"/>

  <!-- Left Column: Dual Modalities (Width: 240, x: 28) -->
  <g transform="translate(28, 26)">
    <text x="0" y="0" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#86868b" text-transform="uppercase">Input Modalities (3,491 Obs)</text>

    <!-- Card 1: Social Sentiment -->
    <g transform="translate(0, 14)" filter="url(#btc-card-shadow)">
      <rect width="240" height="118" rx="14" fill="#ffffff" stroke="#e5e5ea" stroke-width="1"/>
      <circle cx="26" cy="24" r="12" fill="#fff5eb"/>
      <text x="26" y="28" font-size="12" text-anchor="middle">💬</text>
      <text x="46" y="21" font-size="12" font-weight="700" fill="#1d1d1f">Social Sentiment</text>
      <text x="46" y="35" font-size="10" fill="#86868b">Reddit r/Bitcoin · FinBERT (1h)</text>
      
      <!-- Sparkline with Gradient Area -->
      <path d="M 16 88 L 16 78 Q 45 52, 75 74 T 135 56 T 190 68 L 224 48 L 224 88 Z" fill="url(#spark-fill)"/>
      <path d="M 16 78 Q 45 52, 75 74 T 135 56 T 190 68 L 224 48" fill="none" stroke="#ff9500" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="224" cy="48" r="3" fill="#ff9500"/>
      
      <line x1="16" y1="92" x2="224" y2="92" stroke="#f0f0f2" stroke-width="1"/>
      <text x="16" y="106" font-size="9.5" font-weight="500" fill="#86868b">Continuous crowd sentiment embeddings</text>
    </g>

    <!-- Card 2: Technical Market Stream -->
    <g transform="translate(0, 144)" filter="url(#btc-card-shadow)">
      <rect width="240" height="120" rx="14" fill="#ffffff" stroke="#e5e5ea" stroke-width="1"/>
      <circle cx="26" cy="24" r="12" fill="#edf5ff"/>
      <text x="26" y="28" font-size="12" text-anchor="middle">📈</text>
      <text x="46" y="21" font-size="12" font-weight="700" fill="#1d1d1f">Technical Market Signals</text>
      <text x="46" y="35" font-size="10" fill="#86868b">OHLCV 24h rolling · BiLSTM</text>
      
      <!-- Financial Trendline with Area Fill -->
      <path d="M 16 88 L 16 80 Q 48 90, 80 62 T 135 74 T 185 50 L 224 42 L 224 88 Z" fill="url(#tech-fill)"/>
      <path d="M 16 80 Q 48 90, 80 62 T 135 74 T 185 50 L 224 42" fill="none" stroke="#0071e3" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="224" cy="42" r="3" fill="#0071e3"/>
      
      <line x1="16" y1="92" x2="224" y2="92" stroke="#f0f0f2" stroke-width="1"/>
      <text x="16" y="106" font-size="9.5" font-weight="500" fill="#86868b">24h rolling price &amp; volume features</text>
    </g>
  </g>

  <!-- Flow Lines to Gate (Col 1 to Col 2) -->
  <path d="M268 73 C296 73, 298 120, 326 130" fill="none" stroke="#ff9500" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M268 204 C296 204, 298 160, 326 150" fill="none" stroke="#0071e3" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Center Column: RAML Learnable Sigmoid Gate (Width: 232, x: 326) -->
  <g transform="translate(326, 26)">
    <text x="0" y="0" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#86868b" text-transform="uppercase">Regime Conditioning</text>

    <g transform="translate(0, 14)" filter="url(#btc-card-shadow)">
      <rect width="232" height="250" rx="16" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/>
      
      <!-- Core Brand Pill Header -->
      <rect x="14" y="14" width="204" height="42" rx="10" fill="url(#gate-grad)"/>
      <text x="116" y="32" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">RAML REGIME GATE</text>
      <text x="116" y="46" font-size="9.5" font-weight="500" fill="rgba(255,255,255,0.92)" text-anchor="middle">Volatility-Conditioned Sigmoid</text>

      <g transform="translate(16, 68)">
        <text x="0" y="10" font-size="10" font-weight="600" fill="#86868b">Adaptive Fusion Weight</text>
        <text x="0" y="26" font-family="ui-serif, Georgia, serif" font-size="12.5" font-style="italic" fill="#1d1d1f">g = σ(W_v · [s, t] + b)</text>

        <!-- Sigmoid Graphic Box -->
        <g transform="translate(0, 36)">
          <rect width="200" height="66" rx="8" fill="#f8f8fa" stroke="#e5e5ea" stroke-width="1"/>
          <line x1="14" y1="52" x2="186" y2="52" stroke="#e5e5ea" stroke-width="1"/>
          <line x1="100" y1="12" x2="100" y2="52" stroke="#e5e5ea" stroke-width="1" stroke-dasharray="2 2"/>
          
          <path d="M 24 50 Q 72 50, 100 32 T 176 16" fill="none" stroke="#ff2d55" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="100" cy="32" r="4" fill="#ff2d55"/>
          
          <text x="24" y="61" font-size="8.5" fill="#86868b">Low σ (Sentiment)</text>
          <text x="176" y="61" font-size="8.5" fill="#86868b" text-anchor="end">High σ (Technical)</text>
          <text x="100" y="10" font-size="8.5" font-weight="600" fill="#ff2d55" text-anchor="middle">Threshold σ_24h</text>
        </g>

        <!-- Causal Mechanism Description -->
        <text x="0" y="118" font-size="10.5" font-weight="700" fill="#1d1d1f">Dynamically modulates weights</text>
        <text x="0" y="132" font-size="9.5" fill="#6e6e73">when 24h market volatility σ rises</text>
        
        <rect x="0" y="146" width="200" height="22" rx="7" fill="#e8f5e9"/>
        <text x="100" y="161" font-size="9.5" font-weight="700" fill="#34c759" text-anchor="middle">Prevents Recall Collapse</text>
      </g>
    </g>
  </g>

  <!-- Flow Lines (Col 2 to Col 3) -->
  <path d="M558 73 H588" fill="none" stroke="#34c759" stroke-width="2" stroke-linecap="round"/>
  <path d="M558 204 H588" fill="none" stroke="#ff3b30" stroke-width="2" stroke-linecap="round"/>

  <!-- Right Column: Empirical Comparison (Width: 264, x: 588) -->
  <g transform="translate(588, 26)">
    <text x="0" y="0" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#86868b" text-transform="uppercase">Empirical Comparison</text>

    <!-- Card 1: RAML Gated Model -->
    <g transform="translate(0, 14)" filter="url(#btc-card-shadow)">
      <rect width="264" height="118" rx="14" fill="#ffffff" stroke="#e5e5ea" stroke-width="1"/>
      <text x="16" y="24" font-size="12" font-weight="700" fill="#1d1d1f">RAML Gated Model</text>
      <rect x="166" y="12" width="82" height="18" rx="9" fill="#e8f5e9"/>
      <text x="207" y="24.5" font-size="9.5" font-weight="700" fill="#34c759" text-anchor="middle">Robust Retention</text>
      
      <text x="16" y="58" font-size="28" font-weight="800" fill="#34c759" letter-spacing="-0.03em">0.5513</text>
      <text x="120" y="48" font-size="11" font-weight="700" fill="#1d1d1f">macro-F1 (6h)</text>
      <text x="120" y="62" font-size="10" fill="#86868b">0.5474 at 3h forecast</text>
      
      <rect x="16" y="74" width="232" height="6.5" rx="3.25" fill="#f0f0f2"/>
      <rect x="16" y="74" width="186" height="6.5" rx="3.25" fill="url(#btc-green)"/>
      
      <text x="16" y="98" font-size="10" font-weight="600" fill="#34c759">✓ Retains predictive power in high volatility</text>
      <text x="16" y="110" font-size="9" fill="#86868b">Dynamic attention shields against regime shocks</text>
    </g>

    <!-- Card 2: Static Baseline Collapse -->
    <g transform="translate(0, 144)" filter="url(#btc-card-shadow)">
      <rect width="264" height="120" rx="14" fill="#ffffff" stroke="#e5e5ea" stroke-width="1"/>
      <text x="16" y="24" font-size="12" font-weight="700" fill="#1d1d1f">Static Baseline (No Gate)</text>
      <rect x="176" y="12" width="72" height="18" rx="9" fill="#ffebee"/>
      <text x="212" y="24.5" font-size="9.5" font-weight="700" fill="#ff3b30" text-anchor="middle">Recall Floor</text>
      
      <text x="16" y="60" font-size="28" font-weight="800" fill="#ff3b30" letter-spacing="-0.03em">0.1400</text>
      <text x="120" y="50" font-size="11" font-weight="700" fill="#ff3b30">recall floor (6h)</text>
      <text x="120" y="64" font-size="10" fill="#86868b">Static concat fails</text>
      
      <rect x="16" y="76" width="232" height="6.5" rx="3.25" fill="#f0f0f2"/>
      <rect x="16" y="76" width="38" height="6.5" rx="3.25" fill="url(#btc-red)"/>
      
      <text x="16" y="100" font-size="10" font-weight="600" fill="#ff3b30">⚠️ Severe recall collapse during regime shifts</text>
      <text x="16" y="112" font-size="9" fill="#86868b">Static vectors drowned out by market volatility</text>
    </g>
  </g>
</svg>
